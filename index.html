<!doctype html>
<html lang="en">
<head>
<title>Diablo Canyon Debate Map</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=League+Spartan:wght@400;500&display=swap">
<style>
/* Layout: Debate Map's left-to-right argument tree, softened: white cards with label tabs, quiet curved connectors, premise trays, panels that open inside cards. */
:root{
  --bg:#092e47; --card:#ffffff; --ink:#2a3343; --ink-2:#5d6676; --ink-3:#8a93a1;
  --tab:#eef1f5; --soft:#f1f3f6; --soft-2:#e2e7ee; --inset:#f4f6f9; --tray:rgba(255,255,255,.07);
  --wire:#ffffff; --sup:#86e0b0; --opp:#f7a8b0; --sup-bg:#e4f1ea; --sup-ink:#2a7451; --opp-bg:#f6e6e8; --opp-ink:#a23d48;
  --tag-bg:#fbf1e2; --tag-ink:#94600f; --link:#3b5f9e; --term:#9fb3d6; --term-ink:#6f86b3; --focus:#9cc2ff;
  --neu:-7px -7px 16px rgba(72,124,166,.32),9px 11px 22px rgba(0,8,18,.6),inset 1px 1px 0 rgba(255,255,255,.95),inset -1px -1px 0 rgba(9,46,71,.07);
  --neu-hi:-8px -8px 20px rgba(80,136,180,.4),11px 14px 28px rgba(0,8,18,.65),inset 1px 1px 0 rgba(255,255,255,.95),inset -1px -1px 0 rgba(9,46,71,.07);
  --bump:2px 2px 5px rgba(9,46,71,.13),-2px -2px 5px rgba(255,255,255,.95);
  --press:inset 2px 2px 5px rgba(9,46,71,.13),inset -2px -2px 5px rgba(255,255,255,.9);
  --on-bg:#ffffff; --on-bg-2:rgba(255,255,255,.72); --on-bg-3:rgba(255,255,255,.10);
  --shadow:0 1px 2px rgba(0,10,20,.18),0 4px 14px rgba(0,10,20,.22);
  --font:"Quicksand","Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-ui:"League Spartan","Futura","Century Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#092e47; --card:#ffffff; --ink:#2a3343; --ink-2:#5d6676; --ink-3:#8a93a1;
  --tab:#eef1f5; --soft:#f1f3f6; --soft-2:#e2e7ee; --inset:#f4f6f9; --tray:rgba(255,255,255,.07);
  --wire:#ffffff; --sup:#86e0b0; --opp:#f7a8b0; --sup-bg:#e4f1ea; --sup-ink:#2a7451; --opp-bg:#f6e6e8; --opp-ink:#a23d48;
  --tag-bg:#fbf1e2; --tag-ink:#94600f; --link:#3b5f9e; --term:#9fb3d6; --term-ink:#6f86b3; --focus:#9cc2ff;
  --neu:-7px -7px 16px rgba(72,124,166,.32),9px 11px 22px rgba(0,8,18,.6),inset 1px 1px 0 rgba(255,255,255,.95),inset -1px -1px 0 rgba(9,46,71,.07);
  --neu-hi:-8px -8px 20px rgba(80,136,180,.4),11px 14px 28px rgba(0,8,18,.65),inset 1px 1px 0 rgba(255,255,255,.95),inset -1px -1px 0 rgba(9,46,71,.07);
  --bump:2px 2px 5px rgba(9,46,71,.13),-2px -2px 5px rgba(255,255,255,.95);
  --press:inset 2px 2px 5px rgba(9,46,71,.13),inset -2px -2px 5px rgba(255,255,255,.9);
  --on-bg:#ffffff; --on-bg-2:rgba(255,255,255,.72); --on-bg-3:rgba(255,255,255,.10);
  --shadow:0 1px 2px rgba(0,10,20,.18),0 4px 14px rgba(0,10,20,.22);}}
:root[data-theme="dark"]{
  --bg:#092e47; --card:#ffffff; --ink:#2a3343; --ink-2:#5d6676; --ink-3:#8a93a1;
  --tab:#eef1f5; --soft:#f1f3f6; --soft-2:#e2e7ee; --inset:#f4f6f9; --tray:rgba(255,255,255,.07);
  --wire:#ffffff; --sup:#86e0b0; --opp:#f7a8b0; --sup-bg:#e4f1ea; --sup-ink:#2a7451; --opp-bg:#f6e6e8; --opp-ink:#a23d48;
  --tag-bg:#fbf1e2; --tag-ink:#94600f; --link:#3b5f9e; --term:#9fb3d6; --term-ink:#6f86b3; --focus:#9cc2ff;
  --neu:-7px -7px 16px rgba(72,124,166,.32),9px 11px 22px rgba(0,8,18,.6),inset 1px 1px 0 rgba(255,255,255,.95),inset -1px -1px 0 rgba(9,46,71,.07);
  --neu-hi:-8px -8px 20px rgba(80,136,180,.4),11px 14px 28px rgba(0,8,18,.65),inset 1px 1px 0 rgba(255,255,255,.95),inset -1px -1px 0 rgba(9,46,71,.07);
  --bump:2px 2px 5px rgba(9,46,71,.13),-2px -2px 5px rgba(255,255,255,.95);
  --press:inset 2px 2px 5px rgba(9,46,71,.13),inset -2px -2px 5px rgba(255,255,255,.9);
  --on-bg:#ffffff; --on-bg-2:rgba(255,255,255,.72); --on-bg-3:rgba(255,255,255,.10);
  --shadow:0 1px 2px rgba(0,10,20,.18),0 4px 14px rgba(0,10,20,.22);}

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column}

header{position:relative;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--bg)}
.brand{display:flex;flex-direction:column;gap:1px;min-width:0}
.brand h1{margin:0;font-weight:700;font-size:17px;text-wrap:balance}
.brand span{font-size:12px;color:var(--on-bg-2);font-variant-numeric:tabular-nums}
.search{position:relative;flex:1 1 260px;max-width:520px;min-width:0}
.search input{width:100%;box-sizing:border-box;border:0;border-radius:10px;padding:10px 14px 10px 36px;background:var(--card);box-shadow:var(--shadow);outline:none;font-weight:500}
.search input::placeholder{color:var(--ink-3)}
.search input:focus-visible{box-shadow:var(--shadow),0 0 0 2px var(--focus)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--ink-3);fill:none;stroke-width:2}
.results{position:absolute;left:0;right:0;top:calc(100% + 8px);max-height:min(60vh,520px);overflow:auto;background:var(--card);border-radius:12px;box-shadow:0 10px 30px rgba(30,40,60,.18);padding:6px}
.results button{display:block;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:9px 11px;cursor:pointer}
.results button:hover,.results button:focus-visible{background:var(--soft)}
.r-t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35;font-weight:500}
.r-m{display:block;font-size:11.5px;color:var(--ink-3);margin-top:3px}
.results mark{background:none;color:var(--link);font-weight:700}
.results .empty{padding:12px;color:var(--ink-3)}
.tools{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap}
.pillbtn{border:0;cursor:pointer;border-radius:9px;padding:8px 13px;background:var(--card);box-shadow:var(--shadow);font-weight:700;font-size:12.5px;color:var(--ink-2)}
.pillbtn:hover{color:var(--ink)}
.zoom{display:flex;align-items:center;background:var(--card);border-radius:9px;box-shadow:var(--shadow)}
.zoom button{border:0;background:none;width:32px;height:32px;cursor:pointer;font-size:16px;color:var(--ink-2)}
.zoom output{min-width:42px;text-align:center;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}

main{position:relative;flex:1;min-height:0}
body.touring .node,body.touring #wires path,body.touring .tray,body.touring .pager{transition:none!important}
body.touring #stage{scroll-behavior:auto}
.pillbtn,.zoom button,.zoom output,.search input,.tab,.tag,.atts button,.menu button,.exp,.count,.legend,.credit,.brand span,.pager button,.seg button,.chip,.tray span,.inl .more,.panel .lbl,.results .r-m{font-family:var(--font-ui);font-weight:400!important}
.credit a,.legend span{font-weight:400!important}
.pillbtn{font-size:14px;letter-spacing:.01em}
.tab{font-size:11.5px;letter-spacing:.01em}
.atts button{font-size:12px}
.menu button{font-size:13px}
main::after{content:"";position:absolute;left:0;right:0;bottom:0;height:min(180px,28vh);pointer-events:none;z-index:6;background:linear-gradient(to top,rgba(0,0,0,.6) 0%,rgba(0,0,0,.28) 45%,rgba(0,0,0,0) 100%)}
#stage{position:absolute;inset:0;overflow:auto;cursor:grab}
#stage.panning{cursor:grabbing;user-select:none}
#world{position:relative}
#inner{position:absolute;left:0;top:0;transform-origin:0 0}
#wires{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#wires path{fill:none;stroke-width:1.5;stroke-linecap:round;transition:d .28s ease}
.w0{stroke:var(--wire)} .w1{stroke:var(--sup);stroke-width:1.7!important} .w2{stroke:var(--opp);stroke-width:1.7!important}

.tray{position:absolute;left:0;top:0;border-radius:0 0 0 14px;border-left:3px solid rgba(255,255,255,.45);background:linear-gradient(90deg,var(--tray),transparent 70%);transition:transform .28s ease,height .28s ease,width .28s ease}
.tray span{position:absolute;left:12px;top:-1px;font-size:10.5px;font-weight:700;color:var(--on-bg-2);letter-spacing:.03em;white-space:nowrap}

.node{position:absolute;left:0;top:0;display:flex;flex-direction:column;transition:transform .28s ease,opacity .25s ease}
.node.fresh{opacity:0;z-index:0}
.node{z-index:1}
.instant,.instant .node,.instant .tray,.instant .pager,.instant .menu,.instant #wires path,.node.instant{transition:none!important}
.tabs{display:flex;justify-content:space-between;align-items:flex-end;gap:6px;height:19px;padding:0 10px;min-width:0}
.tabs .l,.tabs .r{display:flex;align-items:flex-end;gap:5px;min-width:0}
.tab{font-size:10.5px;font-weight:600;letter-spacing:.02em;line-height:1;padding:5px 10px 4px;border-radius:6px 6px 0 0;box-shadow:inset 0 1px 0 rgba(255,255,255,.7);background:var(--tab);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:100%;border:0}
.p1 .tab.rel{background:var(--sup-bg);color:var(--sup-ink)}
.p2 .tab.rel{background:var(--opp-bg);color:var(--opp-ink)}
button.tab{cursor:pointer;color:var(--ink-3);font-weight:600}
button.tab:hover,button.tab.on{color:var(--ink)}
.tag{font-size:10.5px;font-weight:700;line-height:1;padding:3px 8px;border-radius:999px;background:var(--tag-bg);color:var(--tag-ink);margin-bottom:3px;white-space:nowrap}
.tag.q{background:var(--tab);color:var(--ink-3)}
.card{position:relative;background:linear-gradient(145deg,#ffffff 0%,#f3f6f9 55%,#e8edf3 100%);border-radius:7px;padding:10px 30px 10px 13px;box-shadow:var(--neu);display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:box-shadow .2s}
.card:hover{box-shadow:var(--neu-hi)}
.sel .card{box-shadow:0 0 0 2px color-mix(in srgb,var(--focus) 60%,transparent),var(--neu)}
.txt{margin:0;font-size:12.8px;font-weight:500;line-height:1.45;overflow-wrap:anywhere}
.kcat .txt{font-weight:700;font-size:13px}
.kroot .txt{font-weight:700;font-size:14px}
.karg .txt.hdr{font-weight:700;font-size:12px;color:var(--ink-2)}
.p1.karg .txt.hdr{color:var(--sup-ink)} .p2.karg .txt.hdr{color:var(--opp-ink)}
.clamp{display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}
.term{cursor:pointer;text-decoration:underline;text-decoration-color:var(--term);text-decoration-thickness:1.5px;text-underline-offset:2px;border-radius:3px}
.term:hover,.term.on{background:color-mix(in srgb,var(--term) 22%,transparent)}
.term sup{font-size:8.5px;color:var(--term-ink);font-weight:700;margin-left:1px}
.atts{display:flex;gap:6px;flex-wrap:wrap}
.atts button{border:0;cursor:pointer;font-size:11px;font-weight:700;padding:5px 10px;border-radius:5px;background:linear-gradient(145deg,#f8fafc,#e9eef3);color:var(--ink-2);box-shadow:var(--bump)}
.atts button:hover{color:var(--ink)}
.atts button.on{background:#e6ebf1;color:var(--ink);box-shadow:var(--press)}
.exp{position:absolute;right:5px;top:5px;bottom:5px;width:18px;border:0;padding:0;border-radius:5px;background:rgba(9,46,71,.05);color:var(--ink-3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.exp:hover{color:var(--ink)}
.exp.on{background:rgba(9,46,71,.1);color:var(--ink)}
.count{position:absolute;right:-36px;top:50%;transform:translateY(-50%);font-size:11.5px;font-weight:700;color:var(--on-bg-2);font-variant-numeric:tabular-nums;width:32px}
.panel{background:var(--inset);box-shadow:var(--press);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;cursor:auto}
.panel p{margin:0;font-size:12.3px;line-height:1.5;white-space:pre-line;overflow-wrap:anywhere}
.panel .lbl{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.panel ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.panel a{color:var(--link);text-decoration:none;font-size:12px;font-weight:600;overflow-wrap:anywhere}
.panel a:hover{text-decoration:underline}
.panel a small{color:var(--ink-3);font-weight:500}
.inl{display:flex;flex-direction:column;gap:5px;cursor:auto}
.inl img.media{max-height:230px;object-fit:cover;cursor:zoom-in}
.panel img.media{cursor:zoom-in}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(4,20,33,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;box-sizing:border-box;cursor:zoom-out}
.lightbox[hidden]{display:none}
.lightbox figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:100%;max-height:calc(100% - 60px)}
.lightbox img{max-width:min(1200px,100%);max-height:calc(100vh - 140px);object-fit:contain;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.5);background:#fff}
.lightbox figcaption{color:#fff;font-size:13px;font-weight:600;text-align:center;max-width:800px}
.lightbox .lb-src{color:#cfe3ff;font-size:12.5px;font-weight:700;text-decoration:none}
.lightbox .lb-x{position:absolute;top:14px;right:16px;width:40px;height:40px;border:0;border-radius:20px;background:rgba(255,255,255,.14);color:#fff;font-size:24px;cursor:pointer}
.inl .cap{font-size:11px;color:var(--ink-3);font-weight:600;line-height:1.35}
.inl .more{align-self:flex-start;border:0;background:none;padding:0;font-size:11.5px;font-weight:700;color:var(--link);cursor:pointer}
.media{display:block;width:100%;border-radius:6px;background:var(--soft)}
.vid{position:relative;display:block;width:100%;aspect-ratio:16/9;border:0;padding:0;border-radius:6px;overflow:hidden;cursor:pointer;background:#111}
.vid img{width:100%;height:100%;object-fit:cover;display:block;opacity:.88}
.vid span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:58px;height:40px;border-radius:10px;background:rgba(220,40,40,.92);display:flex;align-items:center;justify-content:center}
.vid span::after{content:"";border-left:14px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:3px}
.vid b{position:absolute;left:10px;right:10px;bottom:8px;color:#fff;font-size:12px;text-align:left;text-shadow:0 1px 3px rgba(0,0,0,.7)}
iframe.media{aspect-ratio:16/9;border:0}
.seg{display:flex;gap:3px;flex-wrap:wrap;background:var(--soft);border-radius:9px;padding:3px;align-self:flex-start}
.seg button{border:0;background:none;cursor:pointer;font-size:11.5px;font-weight:700;padding:5px 9px;border-radius:7px;color:var(--ink-3)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(40,52,72,.12)}
.seg i{font-style:normal;font-weight:600;opacity:.65;margin-left:3px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--tab);color:var(--ink-2)}
.termrow{display:flex;flex-direction:column;gap:5px;padding:8px 0;border-top:1px solid var(--soft-2)}
.termrow:first-of-type{border-top:0;padding-top:0}
.termrow h4{margin:0;font-size:13.5px;font-weight:700}
.termrow h4 small{font-size:11px;font-weight:600;color:var(--ink-3);margin-left:6px}
.termrow.hl h4{color:var(--link)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12px}
.kv dt{color:var(--ink-3);font-weight:600}
.kv dd{margin:0;overflow-wrap:anywhere}
.minibtn{border:0;cursor:pointer;font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:7px;background:var(--soft-2);color:var(--ink);align-self:flex-start}

.menu{position:absolute;left:0;top:0;z-index:5;display:flex;flex-direction:column;gap:2px;background:linear-gradient(145deg,#ffffff,#eef2f6);border-radius:7px;padding:5px;box-shadow:var(--neu);width:118px;transition:transform .28s ease}
.menu button{border:0;background:none;cursor:pointer;text-align:left;font-size:12px;font-weight:600;color:var(--ink-2);padding:6px 9px;border-radius:7px;display:flex;justify-content:space-between}
.menu button:hover{background:var(--soft);color:var(--ink)}
.menu button.on{background:color-mix(in srgb,var(--focus) 14%,transparent);color:var(--ink)}
.menu button i{font-style:normal;color:var(--ink-3)}

.pager{position:absolute;left:0;top:0;display:flex;gap:6px;transition:transform .28s ease}
.pager button{flex:1;height:24px;border:0;border-radius:8px;cursor:pointer;background:var(--soft-2);color:var(--ink-2);font-size:11.5px;font-weight:700}
.pager button:hover{color:var(--ink)}

.legend{position:absolute;z-index:10;left:max(16px,env(safe-area-inset-left,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));display:flex;gap:16px;flex-wrap:wrap;
  background:var(--on-bg-3);border-radius:10px;padding:8px 14px;font-size:11.5px;font-weight:600;color:var(--on-bg);max-width:calc(100% - 32px);box-sizing:border-box}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:18px;height:2px;border-radius:2px;display:inline-block}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--on-bg-2);font-weight:600}
.toast{position:absolute;z-index:12;left:50%;bottom:max(16px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:9px;font-size:12.5px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.slbrand{display:flex;align-items:center;gap:12px;min-width:0}
.sl-logo{display:flex;align-items:center;justify-content:center;height:68px;padding:4px 0;text-decoration:none;flex:none}
.sl-logo img{height:60px;width:auto;display:block}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:640px){.sl-logo{height:52px;padding:3px 0}.sl-logo img{height:44px}}
.sl-logo span{font-weight:700;font-size:12.5px;color:var(--on-bg);letter-spacing:.02em;white-space:nowrap}
.credit{position:absolute;z-index:10;right:max(16px,env(safe-area-inset-right,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));font-size:11.5px;font-weight:600;color:var(--on-bg-2);background:var(--on-bg-3);border-radius:10px;padding:8px 12px;box-shadow:none}
.credit a{color:var(--on-bg);text-decoration:none}
@media (max-width:640px){.credit{display:none}}
@media (max-width:640px){.brand span{display:none}.tools{margin-left:0}.legend{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>

  const sl = stage.scrollLeft + sx * scale, st = stage.scrollTop + sy * scale;
  paint(visible, []);
  stage.scrollLeft = sl; stage.scrollTop = st;
  void inner.offsetWidth;
  inner.classList.remove('instant');
}
function render(anchorKey){
  const rootD = disp.get('r'); rootD.x = 0; rootD.w = widthOf(rootD);
  const visible = collect(rootD, []);
  const keep = new Set(visible.map(d => d.key));
  for (const [k, el] of els) if (!keep.has(k)){ el.remove(); els.delete(k); }
  const fresh = [];
  for (const d of visible){
    let el = els.get(d.key);
    const isNew = !el;
    if (isNew){ el = document.createElement('div'); el.dataset.key = d.key; layer.appendChild(el); els.set(d.key, el); fresh.push(el); }
    el.className = 'node k' + d.kind + (d.pol ? ' p' + d.pol : '') + (d.key === selKey ? ' sel' : '') + (isNew ? ' fresh' : '');
    if (!isNew) el.style.transitionDelay = '';
    const html = cardHTML(d);
    if (el._html !== html){ el.innerHTML = html; el._html = html; }
  }
  (function setW(d){ d.w = widthOf(d); shownPrem(d).forEach(p => { p.x = d.x + IND; setW(p); }); if (expanded.has(d.key)) visibleRight(d).forEach(c => { c.x = d.x + d.w + GX; setW(c); }); })(rootD);
  for (const d of visible) els.get(d.key).style.width = d.w + 'px';
  for (const d of visible) d.h = els.get(d.key).offsetHeight;
  measure(rootD); place(rootD, 0);
  shiftAll(visible, OX, OY);
  // pin the card the person acted on: everything else moves around it
  const a = anchorKey && disp.get(anchorKey);
  if (a && a.px != null && keep.has(anchorKey)){
    const dx = a.px - a.x, dy = a.py - a.y;
    OX += dx; OY += dy; shiftAll(visible, dx, dy);
  }
  lastVisible = visible;
  paint(visible, fresh);
  wireMedia();
  clearTimeout(settleTimer);
  if (!tour) settleTimer = setTimeout(settle, 650);
}
let menuEl = null;
function renderMenu(){
  const d = selKey && disp.get(selKey);
  if (!d || !els.has(selKey)){ if (menuEl){ menuEl.remove(); menuEl = null; } return; }
  if (!menuEl){ menuEl = document.createElement('div'); menuEl.className = 'menu'; menuEl.setAttribute('role', 'menu'); layer.appendChild(menuEl); }
  const n = N[d.main], st = panel.get(d.key) || {};
  const items = [['phrasings', 'Phrasings', 1 + (n.p || []).length], ['definitions', 'Definitions', (n.m || []).length], ['details', 'Details', ''], ['tags', 'Tags', parse(textOf(d.main, d.fq)).tags.length], ['others', 'Others', '']];
  menuEl.innerHTML = items.map(([k, label, c]) => `<button type="button" role="menuitem" data-menu="${k}" class="${st.menu === k ? 'on' : ''}">${label}<i>${c === '' ? '' : c}</i></button>`).join('');
  menuEl.style.transform = `translate(${d.x - 128}px,${d.y + 19}px)`;
}
function applyScale(){
  inner.style.transform = `scale(${scale})`;
  world.style.width = (parseFloat(inner.style.width) * scale) + 'px';
  world.style.height = (parseFloat(inner.style.height) * scale) + 'px';
  $('zval').textContent = Math.round(scale * 100) + '%';
}
function zoomTo(s, cx, cy){
  s = Math.min(1.6, Math.max(.1, s));
  const r = stage.getBoundingClientRect(); cx = cx ?? r.width / 2; cy = cy ?? r.height / 2;
  const wx = (stage.scrollLeft + cx) / scale, wy = (stage.scrollTop + cy) / scale;
  scale = s; applyScale(); stage.scrollLeft = wx * scale - cx; stage.scrollTop = wy * scale - cy;
}
function centerOn(d){
  const r = stage.getBoundingClientRect();
  stage.scrollTo({left: Math.max(0, (d.x - 140) * scale - r.width * .25), top: (d.y + d.h / 2) * scale - r.height / 2, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
}

/* ---------- media ---------- */
let relayout = null;
function wireMedia(){
  layer.querySelectorAll('img[data-fallback]:not([data-wired])').forEach(img => {
    img.dataset.wired = 1;
    const src = img.getAttribute('src');
    const done = () => { if (loaded.has(src)) return; loaded.add(src); if (tour) return; clearTimeout(relayout); relayout = setTimeout(() => render(selKey), 60); };
    if (img.complete && img.naturalWidth) done();
    img.addEventListener('load', done);
    img.addEventListener('error', () => {
      const yt = img.closest('.vid'); failed.add(yt ? 'yt:' + yt.dataset.yt : src);
      if (tour) return; clearTimeout(relayout); relayout = setTimeout(() => render(selKey), 60);
    });
  });
}

/* ---------- image viewer ---------- */
const lb = $('lightbox');
function openLightbox(src, alt){
  lb.querySelector('img').src = src; lb.querySelector('img').alt = alt || '';
  lb.querySelector('figcaption').textContent = alt && alt !== 'Attached image' ? alt : '';
  lb.querySelector('.lb-src').href = src;
  lb.hidden = false; lb.querySelector('.lb-x').focus();
}
function closeLightbox(){ lb.hidden = true; lb.querySelector('img').removeAttribute('src'); }
lb.addEventListener('click', e => { if (!e.target.closest('.lb-src')) closeLightbox(); });

/* ---------- interaction ---------- */
function toggle(key){
  const d = disp.get(key); if (!d || !(rightCount(d) + premKids(d).length)) return;
  if (expanded.has(key)){ for (const k of [...expanded]) if (k === key || k.startsWith(key + '/') || k.startsWith(key + '~')) expanded.delete(k); }
  else expanded.add(key);
  render(key);
}
function select(key){ selKey = key; render(key); }
layer.addEventListener('click', e => {
  const pg = e.target.closest('.pager');
  if (pg){ const k = pg.dataset.key; if (e.target.closest('[data-more]')) limits.set(k, (limits.get(k) || PAGE) + PAGE); else if (e.target.closest('[data-less]')) limits.set(k, PAGE); render(k); return; }
  const mi = e.target.closest('.menu [data-menu]');
  if (mi && selKey){ const st = panel.get(selKey) || {}; panel.set(selKey, st.menu === mi.dataset.menu ? {} : {menu: mi.dataset.menu}); render(selKey); return; }
  const el = e.target.closest('.node'); if (!el) return;
  const key = el.dataset.key;
  if (e.target.closest('[data-toggle]')) { toggle(key); return; }
  const im = e.target.closest('.inl img.media, .panel img.media');
  if (im){ openLightbox(im.currentSrc || im.src, im.alt); return; }
  const vid = e.target.closest('.vid');
  if (vid){ const f = document.createElement('iframe'); f.className = 'media'; f.src = `https://www.youtube-nocookie.com/embed/${vid.dataset.yt}?autoplay=1&start=${vid.dataset.t}`; f.allow = 'autoplay; encrypted-media; picture-in-picture'; f.allowFullscreen = true; f.title = vid.getAttribute('aria-label'); vid.replaceWith(f); clearTimeout(relayout); relayout = setTimeout(() => render(key), 60); return; }
  if (e.target.closest('a')) return;
  const cp = e.target.closest('[data-copy]');
  if (cp){ copy(cp.dataset.copy); return; }
  const at = e.target.closest('[data-att]');
  if (at){ const i = +at.dataset.att, st = panel.get(key) || {}; panel.set(key, st.att === i ? {} : {att: i}); selKey = key; render(key); return; }
  const pt = e.target.closest('[data-ptype]');
  if (pt){ const st = panel.get(key) || {}; panel.set(key, {...st, ptype: pt.dataset.ptype}); render(key); return; }
  const tm = e.target.closest('[data-term]');
  if (tm){ panel.set(key, {menu:'definitions', term:+tm.dataset.term}); selKey = key; render(key); return; }
  const mt = e.target.closest('.tabs [data-menu]');
  if (mt){ const st = panel.get(key) || {}; panel.set(key, st.menu === mt.dataset.menu ? {} : {menu: mt.dataset.menu}); selKey = key; render(key); return; }
  if (e.target.closest('.panel')) return;
  if (selKey === key){ selKey = null; render(key); } else select(key);
});
layer.addEventListener('dblclick', e => { const el = e.target.closest('.node'); if (el && !e.target.closest('.panel,button,a')) toggle(el.dataset.key); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !lb.hidden){ closeLightbox(); return; }
  if (e.key === 'Escape'){ if (!$('results').hidden) $('results').hidden = true; else if (selKey){ panel.delete(selKey); const k = selKey; selKey = null; render(k); } }
});
async function copy(t){ try { await navigator.clipboard.writeText(t); toast('Copied'); } catch { toast('Select the ID below to copy it'); } }
let tt; function toast(m){ const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 1600); }

$('zin').onclick = () => zoomTo(scale * 1.15);
$('zout').onclick = () => zoomTo(scale / 1.15);
stage.addEventListener('wheel', e => { if (e.ctrlKey || e.metaKey){ e.preventDefault(); const r = stage.getBoundingClientRect(); zoomTo(scale * Math.exp(-e.deltaY * .0025), e.clientX - r.left, e.clientY - r.top); } }, {passive:false});
let pan = null;
stage.addEventListener('pointerdown', e => { if (e.target.closest('.node,.menu,.pager') || e.button !== 0 || e.pointerType === 'touch') return; pan = {x:e.clientX, y:e.clientY, l:stage.scrollLeft, t:stage.scrollTop}; stage.classList.add('panning'); stage.setPointerCapture(e.pointerId); });
stage.addEventListener('pointermove', e => { if (!pan) return; stage.scrollLeft = pan.l - (e.clientX - pan.x); stage.scrollTop = pan.t - (e.clientY - pan.y); });
const endPan = () => { pan = null; stage.classList.remove('panning'); };
stage.addEventListener('pointerup', endPan); stage.addEventListener('pointercancel', endPan);
/* ---------- display all: unpack the whole map wave by wave while a slow camera pulls back ---------- */
let tour = null;
function stopTour(){
  if (!tour) return;
  clearTimeout(tour.t); cancelAnimationFrame(tour.raf); tour = null;
  document.body.classList.remove('touring');
  const b = $('showall'); b.textContent = 'Display all'; b.setAttribute('aria-pressed', 'false');
  render(); // bring back pictures and the usual motion now that the map is still
}
function camera(){
  // one smooth glide, every frame, toward the target view; nothing jumps
  if (!tour) return;
  const c = tour.cam, r = stage.getBoundingClientRect(), k = .045;
  c.s += (c.ts - c.s) * k; c.x += (c.tx - c.x) * k; c.y += (c.ty - c.y) * k;
  if (Math.abs(c.s - scale) > .0005){ scale = c.s; applyScale(); }
  stage.scrollLeft = Math.max(0, c.x * scale - r.width / 2);
  stage.scrollTop = Math.max(0, c.y * scale - r.height * .45);
  tour.raf = requestAnimationFrame(camera);
}
function tourStep(){
  if (!tour) return;
  const t0 = performance.now();
  // the next cards to open: unopened cards already on the map, in reading order, a share of them per wave
  const frontier = lastVisible.filter(d => !expanded.has(d.key) && (rightCount(d) + premKids(d).length));
  if (!frontier.length){ stopTour(); return; }
  const batch = frontier.slice(0, Math.max(6, Math.ceil(frontier.length / 3)));
  batch.forEach(d => { expanded.add(d.key); limits.set(d.key, 1e9); });
  render();
  let maxX = 0;
  for (const d of lastVisible) maxX = Math.max(maxX, d.x + d.w);
  const r = stage.getBoundingClientRect(), c = tour.cam;
  c.ts = Math.min(.6, Math.max(.12, (r.width - 80) / (maxX + 80)));
  c.tx = maxX / 2;
  // keep the debate's starting point at the centre: the map grows outward around it as the view pulls back
  const rootD = disp.get('r'); c.ty = rootD.y + rootD.h / 2;
  tour.t = setTimeout(tourStep, Math.max(2200, (performance.now() - t0) * 2.5));
}
$('showall').onclick = () => {
  if (tour){ stopTour(); return; }
  selKey = null; panel.clear();
  const r = stage.getBoundingClientRect();
  const cx = (stage.scrollLeft + r.width / 2) / scale, cy = (stage.scrollTop + r.height * .45) / scale;
  tour = {t: 0, raf: 0, cam: {s: scale, ts: scale, x: cx, tx: cx, y: cy, ty: cy}};
  document.body.classList.add('touring'); clearTimeout(settleTimer);
  const b = $('showall'); b.textContent = 'Stop'; b.setAttribute('aria-pressed', 'true');
  for (const d of lastVisible) if (expanded.has(d.key)) limits.set(d.key, 1e9);
  tour.raf = requestAnimationFrame(camera);
  tourStep();
};
$('collapse').onclick = () => { stopTour(); limits.clear(); if (scale < .6){ scale = 1; } expanded.clear(); expanded.add('r'); rightKids(disp.get('r')).forEach(c => expanded.add(c.key)); selKey = null; OX = 170; OY = 50; render(); settle(); stage.scrollTo({left:0, top:0}); };

/* ---------- search ---------- */
let qTimer;
$('q').addEventListener('input', () => { clearTimeout(qTimer); qTimer = setTimeout(runSearch, 160); });
$('q').addEventListener('focus', () => { if ($('q').value.trim().length > 2) runSearch(); });
document.addEventListener('pointerdown', e => { if (!e.target.closest('.search')) $('results').hidden = true; });
function buildIndex(){ LOWER = N.map(n => ((n.x || '') + ' ' + (n.q || '') + ' ' + (n.a || []).map(a => (a.c || '') + ' ' + (a.n || '') + ' ' + (a.s || []).map(s => s.join(' ')).join(' ')).join(' ')).toLowerCase()); }
function positionOf(i){ const path = rawPath(i); return path && path[2] !== undefined ? plain(path[2], 1).replace(/^The Diablo Canyon Nuclear Power Plant('s)? /i, '').slice(0, 80) : ''; }
function runSearch(){
  const q = $('q').value.trim().toLowerCase(), box = $('results');
  if (q.length < 3){ box.hidden = true; return; }
  if (!LOWER) buildIndex();
  const words = q.split(/\s+/).filter(Boolean), hits = [];
  for (let i = 0; i < N.length && hits.length < 40; i++){ if ((N[i].x || N[i].q) && words.every(w => LOWER[i].includes(w))) hits.push(i); }
  const re = new RegExp('(' + words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
  box.innerHTML = hits.length ? hits.map(i => `<button type="button" data-i="${i}"><span class="r-t">${esc(plain(i, 1)).replace(re, '<mark>$1</mark>')}</span><span class="r-m">${esc(positionOf(i))}</span></button>`).join('') : '<div class="empty">No matching cards. Try fewer words.</div>';
  box.hidden = false;
}
$('results').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; $('results').hidden = true; reveal(+b.dataset.i); });
function rawPath(target){
  const prev = new Map([[target, -1]]), queue = [target];
  while (queue.length){ const x = queue.shift(); if (x === ROOT) break; for (const p of PARENTS[x] || []) if (!prev.has(p)){ prev.set(p, x); queue.push(p); } }
  if (!prev.has(ROOT)) return null;
  const path = []; for (let x = ROOT; x !== -1; x = prev.get(x)) path.push(x);
  return path;
}
function reveal(i){
  const path = rawPath(i); if (!path) return;
  let d = disp.get('r'), pos = 1;
  while (pos < path.length){
    let c = premKids(d).find(k => k.raw[0] === path[pos]);
    if (c) expanded.add(d.key);
    if (!c){
      const rk = rightKids(d), ix = rk.findIndex(k => k.raw[0] === path[pos]);
      if (ix < 0) break;
      expanded.add(d.key);
      if (ix >= (limits.get(d.key) || PAGE)) limits.set(d.key, Math.ceil((ix + 1) / PAGE) * PAGE);
      c = rk[ix];
    }
    pos += (c.raw.length === 2 && path[pos + 1] === c.raw[1]) ? 2 : 1;
    d = c;
  }
  selKey = d.key; render(); centerOn(d);
}

/* ---------- boot ---------- */
(window.MAP_DATA ? Promise.resolve(window.MAP_DATA) : fetch('map-data.json').then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })).then(data => {
  N = data.n; ROOT = data.root; TERMS = data.terms || [];
  PARENTS = Array.from({length:N.length}, () => null);
  N.forEach((n, i) => (n.k || []).forEach(([c]) => (PARENTS[c] ||= []).push(i)));
  const claims = N.filter(n => n.x || n.q).length, src = N.reduce((s, n) => s + (n.a || []).filter(a => a.k === 'q' || a.k === 'r').length, 0);
  $('stats').textContent = `${claims.toLocaleString()} claims and categories · ${src.toLocaleString()} sourced attachments`;
  const rootD = {raw:[ROOT], main:ROOT, kind:'root', pol:0, fq:0, col:0, key:'r', parent:null, prem:false};
  disp.set('r', rootD);
  expanded.add('r'); rightKids(rootD).forEach(c => expanded.add(c.key));
  $('loading').remove();
  render();
  // open with the question and its positions in view
  requestAnimationFrame(() => { const q = rightKids(rootD)[0]; if (q && q.y != null) stage.scrollTop = Math.max(0, (q.y + q.h / 2) * scale - stage.clientHeight / 2); });
}).catch(err => { $('loading').textContent = `The map data did not load (${err.message}). Reload the page to try again.`; });
})();
</script>
